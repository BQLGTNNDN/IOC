<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
    }

    /* === TOPBAR === */
    .topbar {
      background: linear-gradient(135deg, #0f1a3a 0%, #1a3a6b 45%, #2563a8 100%);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 16px rgba(15, 26, 58, 0.25);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .seal {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }

    .brand-txt strong {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: block;
      line-height: 1.2;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .brand-txt span {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      display: block;
      letter-spacing: 0.2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-right .badge {
      font-size: 10px;
      font-weight: 600;
      color: #7dd3fc;
      padding: 5px 14px;
      background: rgba(125, 211, 252, 0.14);
      border-radius: 20px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .topbar-right .date {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      padding: 5px 16px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* === MAIN: chứa bảng dữ liệu === */
    .main-content {
      flex: 1;
      padding: 20px 24px 24px 24px;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .table-container {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15, 26, 58, 0.06), 0 1px 4px rgba(15, 26, 58, 0.04);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .table-header {
      padding: 18px 24px 14px 24px;
      border-bottom: 1px solid #eef2f6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: #fafcff;
    }

    .table-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #0f1a3a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-header h2 span {
      font-size: 18px;
    }

    .table-header .row-count {
      font-size: 12px;
      color: #6b7a93;
      background: #f1f4f9;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 500;
    }

    .table-scroll {
      flex: 1;
      overflow: auto;
      padding: 0 4px 4px 4px;
    }

    .table-scroll table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 600px;
    }

    table thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }

    table thead th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4a5a72;
      border-bottom: 2px solid #e2e8f0;
      background: #f8fafc;
      white-space: nowrap;
    }

    table tbody td {
      padding: 11px 16px;
      border-bottom: 1px solid #f0f2f6;
      color: #1e293b;
      vertical-align: middle;
      font-size: 13px;
      transition: background 0.15s ease;
    }

    table tbody tr {
      transition: background 0.15s ease;
    }

    table tbody tr:hover {
      background: #f6f9ff;
    }

    table tbody tr:last-child td {
      border-bottom: none;
    }

    /* Badge trạng thái - phong cách hiện đại */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 14px 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .status-badge.success {
      background: #e6f7ec;
      color: #0b6e3a;
    }
    .status-badge.success::before {
      background: #0b6e3a;
    }

    .status-badge.warning {
      background: #fef4e6;
      color: #9f6a0b;
    }
    .status-badge.warning::before {
      background: #9f6a0b;
    }

    .status-badge.danger {
      background: #fde8e8;
      color: #b33a3a;
    }
    .status-badge.danger::before {
      background: #b33a3a;
    }

    .status-badge.info {
      background: #e6f0fc;
      color: #1a6fb5;
    }
    .status-badge.info::before {
      background: #1a6fb5;
    }

    .status-badge.purple {
      background: #ede6fc;
      color: #6d3ab3;
    }
    .status-badge.purple::before {
      background: #6d3ab3;
    }

    .status-badge.teal {
      background: #e6faf8;
      color: #0a7a72;
    }
    .status-badge.teal::before {
      background: #0a7a72;
    }

    /* Định dạng số */
    .num-format {
      font-weight: 500;
      color: #0f1a3a;
    }

    /* Loading */
    .loading-text {
      text-align: center;
      padding: 50px 20px;
      color: #6b7a93;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loading-text .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563a8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* === FOOTER === */
    .footer {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #4a5a72;
      flex-shrink: 0;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-left .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #cbd5e1;
      display: inline-block;
    }

    .footer-right {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .footer a {
      color: #2563a8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s, border-color 0.2s;
      border-bottom: 1.5px solid transparent;
      padding-bottom: 1px;
    }

    .footer a:hover {
      color: #0f1a3a;
      border-bottom-color: #2563a8;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .topbar {
        padding: 0 16px;
        height: 50px;
      }
      .seal {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      .brand-txt strong {
        font-size: 12px;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand-txt span {
        display: none;
      }
      .topbar-right .badge {
        font-size: 9px;
        padding: 3px 12px;
      }
      .topbar-right .date {
        font-size: 10px;
        padding: 3px 12px;
      }
      .main-content {
        padding: 12px 14px 14px 14px;
      }
      .table-container {
        border-radius: 12px;
      }
      .table-header {
        padding: 14px 16px 10px 16px;
      }
      .table-header h2 {
        font-size: 14px;
      }
      .table-scroll {
        padding: 0 2px 2px 2px;
      }
      table {
        font-size: 12px;
        min-width: 500px;
      }
      table thead th,
      table tbody td {
        padding: 9px 12px;
      }
      .footer {
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        text-align: center;
      }
      .footer-right {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 0 10px;
        height: 44px;
      }
      .seal {
        width: 26px;
        height: 26px;
        font-size: 12px;
        border-width: 1.5px;
      }
      .brand-txt strong {
        font-size: 10px;
        max-width: 90px;
      }
      .topbar-right .badge {
        display: none;
      }
      .topbar-right .date {
        font-size: 9px;
        padding: 2px 10px;
      }
      .main-content {
        padding: 6px 8px 10px 8px;
      }
      .table-container {
        border-radius: 10px;
      }
      .table-header {
        padding: 10px 12px 8px 12px;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .table-header h2 {
        font-size: 13px;
      }
      .table-scroll {
        padding: 0 2px 2px 2px;
      }
      table {
        font-size: 11px;
        min-width: 400px;
      }
      table thead th,
      table tbody td {
        padding: 7px 10px;
      }
      .status-badge {
        font-size: 10px;
        padding: 2px 10px 2px 8px;
      }
      .status-badge::before {
        width: 5px;
        height: 5px;
      }
      .footer {
        font-size: 10px;
        padding: 10px 12px;
      }
      .footer-right {
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand">
      <div class="seal">🏛️</div>
      <div class="brand-txt">
        <strong>BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐN</strong>
        <span>Báo cáo Giải Ngân · Kế hoạch 2026</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge">📊 KH 2026</span>
      <span class="date" id="currentDate">--</span>
    </div>
  </header>

  <!-- MAIN: hiển thị dữ liệu dạng bảng -->
  <main class="main-content">
    <div class="table-container">
      <div class="table-header">
        <h2>
          <span>📋</span> Dữ liệu giải ngân
        </h2>
        <span class="row-count" id="rowCount">Đang tải...</span>
      </div>
      <div class="table-scroll">
        <div id="tableWrapper">
          <div class="loading-text">
            <div class="spinner"></div>
            <span>Đang tải dữ liệu...</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-left">
      <span>© 2026 Ban QLDA Giao thông &amp; Nông nghiệp Đà Nẵng</span>
      <span class="dot"></span>
      <span>Báo cáo giải ngân</span>
    </div>
    <div class="footer-right">
      <a href="#">Hướng dẫn</a>
      <a href="#">Liên hệ</a>
      <a href="#">Hỗ trợ</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Hiển thị ngày hiện tại
      const now = new Date();
      const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);

      // --- Lấy dữ liệu từ Google Sheets (định dạng CSV) ---
      const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFBxyVyveDMtWQWhfSGE5oOcHYzb8RWotp4E038nCgAOHMPWmLHV7SedZh4YrEsY3S1O4ausZ9LV9f/pub?gid=1457288891&output=csv';

      const wrapper = document.getElementById('tableWrapper');
      const rowCountEl = document.getElementById('rowCount');

      fetch(sheetUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error('Không thể tải dữ liệu');
          }
          return response.text();
        })
        .then(csvText => {
          const rows = csvText.split('\n').filter(row => row.trim() !== '');
          if (rows.length === 0) {
            wrapper.innerHTML = '<div class="loading-text">📭 Không có dữ liệu</div>';
            rowCountEl.textContent = '0 hàng';
            return;
          }

          // Tách header và body
          const headers = rows[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          const dataRows = rows.slice(1).map(row => {
            const cells = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < row.length; i++) {
              const char = row[i];
              if (char === '"') {
                inQuotes = !inQuotes;
              } else if (char === ',' && !inQuotes) {
                cells.push(current.trim());
                current = '';
              } else {
                current += char;
              }
            }
            cells.push(current.trim());
            return cells.map(c => c.replace(/^"|"$/g, ''));
          });

          // Cập nhật số hàng
          rowCountEl.textContent = `${dataRows.length} hàng`;

          // Xác định cột trạng thái (tìm cột chứa từ khóa)
          let statusColIndex = -1;
          headers.forEach((h, idx) => {
            const lower = h.toLowerCase();
            if (lower.includes('trạng thái') || lower.includes('status') || lower.includes('tình trạng')) {
              statusColIndex = idx;
            }
          });

          // Màu sắc cho badge dựa trên nội dung
          function getStatusBadge(text) {
            const lower = text.toLowerCase();
            if (lower.includes('hoàn thành') || lower.includes('done') || lower.includes('complete') || lower.includes('đã hoàn')) {
              return 'success';
            } else if (lower.includes('đang thực hiện') || lower.includes('in progress') || lower.includes('pending') || lower.includes('thực hiện')) {
              return 'warning';
            } else if (lower.includes('chậm') || lower.includes('delay') || lower.includes('overdue') || lower.includes('trễ')) {
              return 'danger';
            } else if (lower.includes('chưa bắt đầu') || lower.includes('not started') || lower.includes('kế hoạch')) {
              return 'info';
            } else if (lower.includes('tạm dừng') || lower.includes('pause') || lower.includes('dừng')) {
              return 'purple';
            } else if (lower.includes('đạt') || lower.includes('achieve') || lower.includes('vượt')) {
              return 'teal';
            }
            return 'info';
          }

          // Xây dựng bảng HTML
          let tableHTML = '<table>';
          tableHTML += '<thead><tr>';
          headers.forEach(h => {
            tableHTML += `<th>${h}</th>`;
          });
          tableHTML += '</tr></thead>';

          tableHTML += '<tbody>';
          dataRows.forEach(row => {
            tableHTML += '<tr>';
            row.forEach((cell, index) => {
              let displayCell = cell || '—';

              // Định dạng số
              if (!isNaN(displayCell) && displayCell !== '' && displayCell !== '—') {
                const num = parseFloat(displayCell);
                if (!isNaN(num)) {
                  if (Number.isInteger(num)) {
                    displayCell = `<span class="num-format">${num.toLocaleString('vi-VN')}</span>`;
                  } else {
                    displayCell = `<span class="num-format">${num.toLocaleString('vi-VN', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</span>`;
                  }
                }
              }

              // Thêm badge cho cột trạng thái
              if (index === statusColIndex || headers[index].toLowerCase().includes('trạng thái')) {
                const badgeClass = getStatusBadge(cell);
                displayCell = `<span class="status-badge ${badgeClass}">${cell || '—'}</span>`;
              }

              tableHTML += `<td>${displayCell}</td>`;
            });
            tableHTML += '</tr>';
          });
          tableHTML += '</tbody></table>';

          wrapper.innerHTML = tableHTML;
        })
        .catch(error => {
          console.error('Lỗi tải dữ liệu:', error);
          rowCountEl.textContent = 'Lỗi';
          wrapper.innerHTML = `
            <div class="loading-text" style="padding:40px 20px;">
              <span style="font-size:32px;">⚠️</span>
              <span style="color:#b33a3a;font-weight:500;">Không thể tải dữ liệu từ Google Sheets</span>
              <span style="font-size:12px;color:#8a9bb0;">Vui lòng kiểm tra kết nối hoặc thử lại sau</span>
            </div>
          `;
        });
    });
  </script>

</body>
</html>
