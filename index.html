<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dữ liệu IOC| Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, Arial, sans-serif;
      background: #f4f6fb;
    }

    /* === TOPBAR === */
    .topbar {
      background: linear-gradient(135deg, #0f1a3a 0%, #1a3a6b 45%, #2563a8 100%);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 16px rgba(15, 26, 58, 0.25);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .seal {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }

    .brand-txt strong {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: block;
      line-height: 1.2;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .brand-txt span {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      display: block;
      letter-spacing: 0.2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-right .badge {
      font-size: 10px;
      font-weight: 600;
      color: #7dd3fc;
      padding: 5px 14px;
      background: rgba(125, 211, 252, 0.14);
      border-radius: 20px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .topbar-right .date {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      padding: 5px 16px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* === MAIN: IFRAME === */
    .main-wrap {
      height: calc(100vh - 56px);
      width: 100%;
      padding: 16px 20px 20px 20px;
      background: #f4f6fb;
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(15, 26, 58, 0.06), 0 1px 4px rgba(15, 26, 58, 0.04);
      background: #ffffff;
      position: relative;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* === FOOTER === */
    .footer {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #4a5a72;
      flex-shrink: 0;
      height: 52px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-left .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #cbd5e1;
      display: inline-block;
    }

    .footer-right {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .footer a {
      color: #2563a8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s, border-color 0.2s;
      border-bottom: 1.5px solid transparent;
      padding-bottom: 1px;
    }

    .footer a:hover {
      color: #0f1a3a;
      border-bottom-color: #2563a8;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .topbar {
        padding: 0 16px;
        height: 50px;
      }
      .seal {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      .brand-txt strong {
        font-size: 12px;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand-txt span {
        display: none;
      }
      .topbar-right .badge {
        font-size: 9px;
        padding: 3px 12px;
      }
      .topbar-right .date {
        font-size: 10px;
        padding: 3px 12px;
      }
      .main-wrap {
        padding: 10px 12px 12px 12px;
        height: calc(100vh - 50px);
      }
      .iframe-container {
        border-radius: 12px;
      }
      .footer {
        flex-direction: column;
        gap: 6px;
        padding: 10px 16px;
        height: auto;
        min-height: 48px;
        text-align: center;
      }
      .footer-right {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 0 10px;
        height: 44px;
      }
      .seal {
        width: 26px;
        height: 26px;
        font-size: 12px;
        border-width: 1.5px;
      }
      .brand-txt strong {
        font-size: 10px;
        max-width: 90px;
      }
      .topbar-right .badge {
        display: none;
      }
      .topbar-right .date {
        font-size: 9px;
        padding: 2px 10px;
      }
      .main-wrap {
        padding: 6px 8px 10px 8px;
        height: calc(100vh - 44px);
      }
      .iframe-container {
        border-radius: 10px;
      }
      .footer {
        font-size: 10px;
        padding: 8px 12px;
        min-height: 42px;
      }
      .footer-right {
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand">
      <div class="seal">🏛️</div>
      <div class="brand-txt">
        <strong>BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐN</strong>
        <span>Báo cáo Giải Ngân · Kế hoạch 2026</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge">📊 KH 2026</span>
      <span class="date" id="currentDate">--</span>
    </div>
  </header>

  <!-- MAIN: IFRAME -->
  <div class="main-wrap">
    <div class="iframe-container">
 <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQFBxyVyveDMtWQWhfSGE5oOcHYzb8RWotp4E038nCgAOHMPWmLHV7SedZh4YrEsY3S1O4ausZ9LV9f/pubhtml?gid=1457288891&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-left">
      <span>© 2026 Ban QLDA Giao thông &amp; Nông nghiệp Đà Nẵng</span>
      <span class="dot"></span>
      <span>Báo cáo giải ngân</span>
    </div>
    <div class="footer-right">
      <a href="#">Hướng dẫn</a>
      <a href="#">Liên hệ</a>
      <a href="#">Hỗ trợ</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);
    });
  </script>

</body>
</html>
